<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 760 142"><title id="title">Your first Flisk contribution</title><desc id="desc">Find a task, make one change, check it, and share a pull request.</desc><style>@keyframes pulse{0%{opacity:.5;transform:scale(.7)}80%{opacity:0;transform:scale(1.8)}}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.line{stroke-dasharray:9 8;animation:travel 2.8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}.pulse.delay{animation-delay:1s}@media (prefers-reduced-motion:reduce){.line,.pulse{animation:none}.line{stroke-dasharray:none}.pulse{display:none}}</style><rect width="758" height="140" x="1" y="1" fill="#f7f5ef" stroke="#e4e0d6" rx="22"/><path fill="none" stroke="#b7c8c0" stroke-width="4" d="M100 53 H660" class="line"/><g text-anchor="middle"><g transform="translate(100 53)"><circle r="25" fill="#4b8b72" class="pulse" opacity=".22"/><circle r="17" fill="#28634d"/><text y="6" fill="#fff" font-size="17" font-weight="700">1</text><text y="48" fill="#263a31" font-size="14" font-weight="700">Find a task</text></g><g transform="translate(287 53)"><circle r="25" fill="#4b8b72" class="pulse delay" opacity=".22"/><circle r="17" fill="#28634d"/><text y="6" fill="#fff" font-size="17" font-weight="700">2</text><text y="48" fill="#263a31" font-size="14" font-weight="700">Make one change</text></g><g transform="translate(473 53)"><circle r="25" fill="#4b8b72" class="pulse" opacity=".22"/><circle r="17" fill="#28634d"/><text y="6" fill="#fff" font-size="17" font-weight="700">3</text><text y="48" fill="#263a31" font-size="14" font-weight="700">Check your work</text></g><g transform="translate(660 53)"><circle r="25" fill="#4b8b72" class="pulse delay" opacity=".22"/><circle r="17" fill="#28634d"/><text y="6" fill="#fff" font-size="17" font-weight="700">4</text><text y="48" fill="#263a31" font-size="14" font-weight="700">Open a PR</text></g></g><text x="380" y="124" fill="#60736a" font-size="12" text-anchor="middle">One small step at a time. Ask for help whenever you need it.</text></svg>